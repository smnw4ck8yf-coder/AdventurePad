replace the opaque catalog preview, then export this entire canvas as one PNG.</text><text x="80" y="162" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#18212a">01  TOP GAMEPLAY SURROUND  •  top.surround  •  1920×1080</text><text x="2080" y="162" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#18212a">02  BOTTOM TRACKPAD  •  bottom.trackpad.background  •  1240×1080</text><text x="3400" y="162" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#18212a">03  BOTTOM SPLIT VIEW  •  bottom.split.background  •  1240×1080</text><text x="80" y="1402" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#18212a">04  COMPANION  •  companion.background  •  1240×1080</text><text x="1400" y="1402" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#18212a">05  NOTES  •  notes.background  •  1240×1080</text><text x="2720" y="1402" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#18212a">06  WALKTHROUGH  •  walkthrough.background  •  1240×1080</text><text x="80" y="2642" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#18212a">07  TRACKPAD SURFACE  •  trackpad.surface  •  1240×720</text><text x="1400" y="2642" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#18212a">08  PANEL FRAME  •  panel.frame  •  1240×360</text><text x="2720" y="2642" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#18212a">09  CATALOG PREVIEW  •  preview  •  1200×675</text><text x="80" y="3542" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#18212a">10  LMB NORMAL  •  button.lmb.normal  •  528×224</text><text x="688" y="3542" font-family="Arial, sans-serif" font-size="17" font-weight="700" tex