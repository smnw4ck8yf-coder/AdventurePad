<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#263746" stroke-width="1"/></pattern><pattern id="danger" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="20" fill="#ff5b63" fill-opacity=".16"/></pattern><pattern id="dynamic" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 24L24 0" stroke="#24d4e8" stroke-opacity=".18" stroke-width="6"/></pattern></defs><rect width="1920" height="1080" fill="#101820"/><rect width="1920" height="1080" fill="url(#grid)"/><rect x="4" y="4" width="1912" height="1072" fill="none" stroke="#f4f7fa" stroke-width="8"/><rect x="22" y="18" width="1150" height="84" rx="10" fill="#101820" fill-opacity=".94"/><text x="38" y="52" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#f4f7fa">TOP GAMEPLAY / top.surround</text><text x="38" y="82" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Exact display canvas 1920×1080 px — every actual runtime game viewport is protected</text><rect x="0" y="0" width="1920" height="1080" fill="url(#danger)" stroke="#ff5b63" stroke-width="4"/><rect x="96" y="0" width="1728" height="1080" rx="0" fill="#ffc857" fill-opacity="0.05" stroke="#ffc857" stroke-width="6" stroke-dasharray="24 14"/><rect x="240" y="0" width="1440" height="1080" rx="0" fill="#24d4e8" fill-opacity="0.06" stroke="#24d4e8" stroke-width="6" stroke-dasharray="24 14"/><rect x="0" y="0" width="96" height="1080" rx="0" fill="#4ddd8b" fill-opacity="0.13" stroke="#4ddd8b" stroke-width="4"/><rect x="1824" y="0" width="96" height="1080" rx="0" fill="#4ddd8b" fill-opacity="0.13" stroke="#4ddd8b" stroke-width="4"/><rect x="640" y="150" width="900" height="186" rx="10" fill="#101820" fill-opacity=".94" stroke="#263746" stroke-width="2"/><text x="654" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#f4f7fa">RUNTIME CONTRACT</text><text x="654" y="205" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Bitmap fills the display, then SkinSurroundView clipOutRect(viewport).</text><text x="654" y="232" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">No pixel is guaranteed artwork-visible: full-screen 16:9 hides all art.</text><text x="654" y="259" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">4:3 leaves 240 px per side; 16:10 leaves 96 px per side on this canvas.</text><text x="654" y="286" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">ScummVM GUI/overlay reports full display protected (no surround).</text><text x="654" y="313" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Split View may expand the upper crop and changes the protected rectangle.</text><text x="270" y="930" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#24d4e8">CYAN 4:3 protected edge</text><text x="110" y="965" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffc857">AMBER 16:10 protected edge</text><text x="960" y="930" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#ff5b63">RED HATCH = 16:9 full-screen protected viewport</text><text x="120" y="1010" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#4ddd8b">Potential surround only; never place required information here</text><rect x="18" y="1021" width="1884" height="45" rx="8" fill="#101820" fill-opacity=".95"/><rect x="28" y="1036" width="20" height="20" fill="#4ddd8b"/><text x="56" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">artwork-safe</text><rect x="196" y="1036" width="20" height="20" fill="#ff5b63"/><text x="224" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">live/protected</text><rect x="382" y="1036" width="20" height="20" fill="#24d4e8"/><text x="410" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">dynamic</text><rect x="505" y="1036" width="20" height="20" fill="#ffc857"/><text x="533" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">native text/control</text><rect x="736" y="1036" width="20" height="20" fill="#dc78ff"/><text x="764" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">runtime inset</text></svg>