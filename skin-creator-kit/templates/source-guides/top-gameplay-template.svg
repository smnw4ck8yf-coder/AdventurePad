<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#263746" stroke-width="1"/></pattern><pattern id="danger" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="20" fill="#ff5b63" fill-opacity=".16"/></pattern><pattern id="dynamic" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 24L24 0" stroke="#24d4e8" stroke-opacity=".18" stroke-width="6"/></pattern></defs><rect width="1920" height="1080" fill="#101820"/><rect width="1920" height="1080" fill="url(#grid)"/><rect x="4" y="4" width="1912" height="1072" fill="none" stroke="#f4f7fa" stroke-width="8"/><rect x="22" y="18" width="1150" height="84" rx="10" fill="#101820" fill-opacity=".94"/><text x="38" y="52" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#f4f7fa">TOP GAMEPLAY / top.surround</text><text x="38" y="82" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Two full-height side panels • keep the large central gameplay area transparent</text><rect x="0" y="0" width="240" height="1080" rx="0" fill="#4ddd8b" fill-opacity="0.16" stroke="#4ddd8b" stroke-width="5"/><rect x="1680" y="0" width="240" height="1080" rx="0" fill="#4ddd8b" fill-opacity="0.16" stroke="#4ddd8b" stroke-width="5"/><rect x="240" y="0" width="80" height="1080" rx="0" fill="#ffc857" fill-opacity="0.12" stroke="#ffc857" stroke-width="4" stroke-dasharray="16 10"/><rect x="1600" y="0" width="80" height="1080" rx="0" fill="#ffc857" fill-opacity="0.12" stroke="#ffc857" stroke-width="4" stroke-dasharray="16 10"/><rect x="320" y="0" width="1280" height="1080" fill="url(#danger)" stroke="#ff5b63" stroke-width="4"/><text x="120" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#4ddd8b">LEFT PANEL</text><text x="960" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#ff5b63">CENTRAL GAMEPLAY-SAFE AREA — KEEP TRANSPARENT</text><text x="1800" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#4ddd8b">RIGHT PANEL</text><rect x="610" y="155" width="700" height="213" rx="10" fill="#101820" fill-opacity=".94" stroke="#263746" stroke-width="2"/><text x="624" y="183" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#f4f7fa">AUTHORING CONTRACT</text><text x="624" y="210" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Decorate primarily in the green left/right panels; either may be narrower.</text><text x="624" y="237" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Amber 80 px bands allow alpha edges, shadows, vines, and torn-paper overlap.</text><text x="624" y="264" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Keep x=320…1600 transparent for the full height; no top/bottom centre rails.</text><text x="624" y="291" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Low alpha (≤32) is ignored; up to 0.5% stronger centre pixels are tolerated.</text><text x="624" y="318" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Normal mode composites the complete PNG above the game using authored alpha.</text><text x="624" y="345" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Split View does not show this decorative surround as the normal top surround.</text><text x="280" y="930" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#ffc857">80 px EDGE OVERLAP</text><text x="1640" y="930" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#ffc857">80 px EDGE OVERLAP</text><text x="960" y="970" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#ff5b63">NOT A FOUR-SIDED FRAME</text><text x="960" y="1005" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#f4f7fa">Small corner transitions are fine • substantial top/bottom rails are not</text><rect x="18" y="1021" width="1884" height="45" rx="8" fill="#101820" fill-opacity=".95"/><rect x="28" y="1036" width="20" height="20" fill="#4ddd8b"/><text x="56" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">artwork-safe</text><rect x="196" y="1036" width="20" height="20" fill="#ff5b63"/><text x="224" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">live/protected</text><rect x="382" y="1036" width="20" height="20" fill="#24d4e8"/><text x="410" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">dynamic</text><rect x="505" y="1036" width="20" height="20" fill="#ffc857"/><text x="533" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">native text/control</text><rect x="736" y="1036" width="20" height="20" fill="#dc78ff"/><text x="764" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">runtime inset</text></svg>