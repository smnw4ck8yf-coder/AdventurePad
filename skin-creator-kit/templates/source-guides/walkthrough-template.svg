<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1080" viewBox="0 0 1240 1080"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#263746" stroke-width="1"/></pattern><pattern id="danger" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="20" fill="#ff5b63" fill-opacity=".16"/></pattern><pattern id="dynamic" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 24L24 0" stroke="#24d4e8" stroke-opacity=".18" stroke-width="6"/></pattern></defs><rect width="1240" height="1080" fill="#101820"/><rect width="1240" height="1080" fill="url(#grid)"/><rect x="4" y="4" width="1232" height="1072" fill="none" stroke="#f4f7fa" stroke-width="8"/><rect x="22" y="18" width="1150" height="84" rx="10" fill="#101820" fill-opacity=".94"/><text x="38" y="52" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#f4f7fa">WALKTHROUGH — READER / walkthrough.background</text><text x="38" y="82" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Standard: opaque native page. Immersive: artwork is the page; native controls remain conditional</text><rect x="0" y="0" width="1240" height="1080" rx="0" fill="#dc78ff" fill-opacity="0.025" stroke="#dc78ff" stroke-width="5" stroke-dasharray="18 12"/><text x="620" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#dc78ff">Reference scenario shown: safeDrawing = 0 px, density = 2 px/dp</text><rect x="37" y="32" width="1166" height="1015" rx="18" fill="#24d4e8" fill-opacity="0.05" stroke="#24d4e8" stroke-width="5" stroke-dasharray="18 12"/><text x="49" y="60" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#24d4e8">Page overlay = 94% of safeDrawing bounds, centered</text><rect x="37" y="32" width="1166" height="112" rx="0" fill="#ffc857" fill-opacity="0.1" stroke="#ffc857" stroke-width="4"/><text x="49" y="60" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffc857">Native toolbar/header</text><line x1="37" y1="144" x2="1203" y2="144" stroke="#ffc857" stroke-width="3"/><rect x="53" y="40" width="96" height="96" rx="0" fill="#ffc857" fill-opacity="0.065" stroke="#ffc857" stroke-width="2"/><text x="65" y="68" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffc857">BACK</text><rect x="560" y="40" width="120" height="96" rx="0" fill="#ffc857" fill-opacity="0.065" stroke="#ffc857" stroke-width="2"/><text x="572" y="68" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffc857">READER</text><rect x="680" y="40" width="120" height="96" rx="0" fill="#ffc857" fill-opacity="0.065" stroke="#ffc857" stroke-width="2"/><text x="692" y="68" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffc857">SEARCH</text><rect x="800" y="40" width="144" height="96" rx="0" fill="#ffc857" fill-opacity="0.065" stroke="#ffc857" stroke-width="2"/><text x="812" y="68" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffc857">CONTENTS</text><rect x="944" y="40" width="90" height="96" rx="0" fill="#ffc857" fill-opacity="0.065" stroke="#ffc857" stroke-width="2"/><text x="956" y="68" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffc857">MORE</text><rect x="1075" y="40" width="108" height="96" rx="0" fill="#ffc857" fill-opacity="0.065" stroke="#ffc857" stroke-width="2"/><text x="1087" y="68" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffc857">CLOSE</text><rect x="37" y="144" width="1166" height="110" rx="0" fill="#24d4e8" fill-opacity="0.05" stroke="#24d4e8" stroke-width="4" stroke-dasharray="16 10"/><text x="49" y="172" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#24d4e8">Optional settings/search bar — dynamic height</text><rect x="37" y="256" width="1166" height="791" fill="url(#dynamic)" stroke="#24d4e8" stroke-width="4"/><text x="49" y="284" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#24d4e8">Reader / Contents / Search results — scrolling live content</text><rect x="69" y="288" width="1102" height="708" rx="0" fill="#ff5b63" fill-opacity="0.035" stroke="#ff5b63" stroke-width="3"/><text x="81" y="316" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ff5b63">Immersive reading area: keep pale/quiet; dark native text; 16 dp H / 12 dp V padding</text><rect x="330" y="430" width="670" height="159" rx="10" fill="#101820" fill-opacity=".94" stroke="#263746" stroke-width="2"/><text x="344" y="458" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#f4f7fa">TOOLBAR RULES</text><text x="344" y="485" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Row padding 8 dp horizontal / 4 dp vertical; back/close 48×48 dp min.</text><text x="344" y="512" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">READER/SEARCH/CONTENTS are content-width, 40 dp min height.</text><text x="344" y="539" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">MORE is 40 dp min height; menus overlay dynamically.</text><text x="344" y="566" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Search, contents and reader settings can add/reflow native UI.</text><rect x="18" y="1021" width="1204" height="45" rx="8" fill="#101820" fill-opacity=".95"/><rect x="28" y="1036" width="20" height="20" fill="#4ddd8b"/><text x="56" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">artwork-safe</text><rect x="196" y="1036" width="20" height="20" fill="#ff5b63"/><text x="224" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">live/protected</text><rect x="382" y="1036" width="20" height="20" fill="#24d4e8"/><text x="410" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">dynamic</text><rect x="505" y="1036" width="20" height="20" fill="#ffc857"/><text x="533" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">native text/control</text><rect x="736" y="1036" width="20" height="20" fill="#dc78ff"/><text x="764" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">runtime inset</text></svg>