<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1080" viewBox="0 0 1240 1080"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#263746" stroke-width="1"/></pattern><pattern id="danger" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="20" fill="#ff5b63" fill-opacity=".16"/></pattern><pattern id="dynamic" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 24L24 0" stroke="#24d4e8" stroke-opacity=".18" stroke-width="6"/></pattern></defs><rect width="1240" height="1080" fill="#101820"/><rect width="1240" height="1080" fill="url(#grid)"/><rect x="4" y="4" width="1232" height="1072" fill="none" stroke="#f4f7fa" stroke-width="8"/><rect x="22" y="18" width="1150" height="84" rx="10" fill="#101820" fill-opacity=".94"/><text x="38" y="52" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#f4f7fa">BOTTOM — NORMAL TRACKPAD</text><text x="38" y="82" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Exact canvas 1240×1080 px; source constants shown in dp/fractions; reference scenario is explicitly conditional</text><rect x="0" y="0" width="1240" height="1080" rx="0" fill="#dc78ff" fill-opacity="0.025" stroke="#dc78ff" stroke-width="5" stroke-dasharray="18 12"/><text x="620" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#dc78ff">Reference scenario shown: safeDrawing = 0 px, density = 2 px/dp</text><rect x="24" y="6" width="1192" height="940" fill="url(#dynamic)" stroke="#24d4e8" stroke-width="4"/><rect x="24" y="770" width="405" height="176" rx="0" fill="#ff5b63" fill-opacity="0.15" stroke="#ff5b63" stroke-width="4"/><text x="36" y="798" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ff5b63">LMB touch + artwork</text><rect x="811" y="770" width="405" height="176" rx="0" fill="#ff5b63" fill-opacity="0.15" stroke="#ff5b63" stroke-width="4"/><text x="823" y="798" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ff5b63">RMB touch + artwork</text><rect x="24" y="6" width="1192" height="764" rx="0" fill="#4ddd8b" fill-opacity="0.055" stroke="#4ddd8b" stroke-width="3"/><text x="36" y="34" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#4ddd8b">Trackpad gesture area (excluding current L/R overlays)</text><rect x="76" y="826" width="300" height="88" rx="0" fill="#ffc857" fill-opacity="0.04" stroke="#ffc857" stroke-width="2" stroke-dasharray="12 8"/><text x="88" y="854" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffc857">native label safe zone</text><rect x="864" y="826" width="300" height="88" rx="0" fill="#ffc857" fill-opacity="0.04" stroke="#ffc857" stroke-width="2" stroke-dasharray="12 8"/><text x="876" y="854" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffc857">native label safe zone</text><rect x="24" y="952" width="264" height="112" rx="14" fill="#ffc857" fill-opacity="0.11" stroke="#ffc857" stroke-width="4"/><text x="36" y="980" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffc857">COMPANION min 132×56 dp</text><rect x="976" y="952" width="264" height="112" rx="14" fill="#ffc857" fill-opacity="0.11" stroke="#ffc857" stroke-width="4"/><text x="988" y="980" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffc857">SETTINGS min 132×56 dp</text><line x1="0" y1="952" x2="1240" y2="952" stroke="#24d4e8" stroke-width="4" stroke-dasharray="18 10"/><rect x="350" y="120" width="610" height="267" rx="10" fill="#101820" fill-opacity=".94" stroke="#263746" stroke-width="2"/><text x="364" y="148" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#f4f7fa">SOURCE-BACKED PLACEMENT</text><text x="364" y="175" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Touch outer padding: horizontal 12 dp; vertical 3 dp.</text><text x="364" y="202" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">L/R width = 34% of TouchSurface each.</text><text x="364" y="229" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">L/R height = clamp(22% of surface, 56 dp, 88 dp).</text><text x="364" y="256" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Utility row padding: horizontal 12 dp; vertical 4 dp.</text><text x="364" y="283" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Companion and Settings each use separate NORMAL/PRESSED assets shown below.</text><text x="364" y="310" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">No connection-status text is rendered on this screen.</text><text x="364" y="337" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Immersive hides native labels, borders, marker, and button chrome.</text><text x="364" y="364" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Trackpad is weighted; height changes with insets/window size.</text><rect x="18" y="1021" width="1204" height="45" rx="8" fill="#101820" fill-opacity=".95"/><rect x="28" y="1036" width="20" height="20" fill="#4ddd8b"/><text x="56" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">artwork-safe</text><rect x="196" y="1036" width="20" height="20" fill="#ff5b63"/><text x="224" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">live/protected</text><rect x="382" y="1036" width="20" height="20" fill="#24d4e8"/><text x="410" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">dynamic</text><rect x="505" y="1036" width="20" height="20" fill="#ffc857"/><text x="533" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">native text/control</text><rect x="736" y="1036" width="20" height="20" fill="#dc78ff"/><text x="764" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">runtime inset</text></svg>