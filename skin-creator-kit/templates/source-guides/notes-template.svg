<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1080" viewBox="0 0 1240 1080"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#263746" stroke-width="1"/></pattern><pattern id="danger" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="20" fill="#ff5b63" fill-opacity=".16"/></pattern><pattern id="dynamic" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 24L24 0" stroke="#24d4e8" stroke-opacity=".18" stroke-width="6"/></pattern></defs><rect width="1240" height="1080" fill="#101820"/><rect width="1240" height="1080" fill="url(#grid)"/><rect x="4" y="4" width="1232" height="1072" fill="none" stroke="#f4f7fa" stroke-width="8"/><rect x="22" y="18" width="1150" height="84" rx="10" fill="#101820" fill-opacity=".94"/><text x="38" y="52" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#f4f7fa">NOTES / notes.background</text><text x="38" y="82" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Standard: opaque native page. Immersive: artwork is the page; native editor remains keyboard-sensitive</text><rect x="0" y="0" width="1240" height="1080" rx="0" fill="#dc78ff" fill-opacity="0.025" stroke="#dc78ff" stroke-width="5" stroke-dasharray="18 12"/><text x="620" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#dc78ff">Reference scenario shown: safeDrawing = 0 px, density = 2 px/dp</text><rect x="37" y="32" width="1166" height="1015" rx="18" fill="#24d4e8" fill-opacity="0.05" stroke="#24d4e8" stroke-width="5" stroke-dasharray="18 12"/><text x="49" y="60" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#24d4e8">Page overlay = 94% of safeDrawing bounds, centered</text><rect x="37" y="32" width="1166" height="144" rx="0" fill="#ffc857" fill-opacity="0.1" stroke="#ffc857" stroke-width="4"/><text x="49" y="60" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffc857">Native toolbar/header</text><line x1="37" y1="176" x2="1203" y2="176" stroke="#ffc857" stroke-width="3"/><rect x="55" y="48" width="96" height="96" rx="0" fill="#ffc857" fill-opacity="0.08" stroke="#ffc857" stroke-width="3"/><text x="67" y="76" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffc857">BACK 48 dp</text><rect x="1087" y="48" width="96" height="112" rx="0" fill="#ffc857" fill-opacity="0.08" stroke="#ffc857" stroke-width="3"/><text x="1099" y="76" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffc857">CLOSE 48×56 dp</text><rect x="69" y="208" width="1102" height="42" rx="0" fill="#ffc857" fill-opacity="0.06" stroke="#ffc857" stroke-width="2"/><text x="81" y="236" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffc857">Auto-save message — contrast critical</text><rect x="69" y="268" width="1102" height="740" fill="url(#dynamic)" stroke="#24d4e8" stroke-width="4"/><text x="81" y="296" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#24d4e8">OutlinedTextField: weight(1), minLines 8, scrollable text</text><rect x="69" y="780" width="1102" height="250" rx="0" fill="#dc78ff" fill-opacity="0.07" stroke="#dc78ff" stroke-width="4" stroke-dasharray="18 10"/><text x="81" y="808" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#dc78ff">IME/keyboard may shrink this region upward (adjustResize)</text><rect x="300" y="300" width="640" height="132" rx="10" fill="#101820" fill-opacity=".94" stroke="#263746" stroke-width="2"/><text x="314" y="328" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#f4f7fa">IMMERSIVE TEXT SAFE AREA</text><text x="314" y="355" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Keep this region pale and low contrast; native content padding is 16 dp.</text><text x="314" y="382" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Done is the keyboard IME action, not an in-page artwork button.</text><text x="314" y="409" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Text/placeholder/cursor/outline remain native and dark in Immersive.</text><rect x="18" y="1021" width="1204" height="45" rx="8" fill="#101820" fill-opacity=".95"/><rect x="28" y="1036" width="20" height="20" fill="#4ddd8b"/><text x="56" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">artwork-safe</text><rect x="196" y="1036" width="20" height="20" fill="#ff5b63"/><text x="224" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">live/protected</text><rect x="382" y="1036" width="20" height="20" fill="#24d4e8"/><text x="410" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">dynamic</text><rect x="505" y="1036" width="20" height="20" fill="#ffc857"/><text x="533" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">native text/control</text><rect x="736" y="1036" width="20" height="20" fill="#dc78ff"/><text x="764" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">runtime inset</text></svg>