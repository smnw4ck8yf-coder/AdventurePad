<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1080" viewBox="0 0 1240 1080"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#263746" stroke-width="1"/></pattern><pattern id="danger" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="20" fill="#ff5b63" fill-opacity=".16"/></pattern><pattern id="dynamic" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 24L24 0" stroke="#24d4e8" stroke-opacity=".18" stroke-width="6"/></pattern></defs><rect width="1240" height="1080" fill="#101820"/><rect width="1240" height="1080" fill="url(#grid)"/><rect x="4" y="4" width="1232" height="1072" fill="none" stroke="#f4f7fa" stroke-width="8"/><rect x="22" y="18" width="1150" height="84" rx="10" fill="#101820" fill-opacity=".94"/><text x="38" y="52" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#f4f7fa">BOTTOM — SPLIT VIEW</text><text x="38" y="82" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Live mirrored crop occupies dynamic top height; remaining native trackpad and utility row stay responsive</text><rect x="0" y="0" width="1240" height="1080" rx="0" fill="#dc78ff" fill-opacity="0.025" stroke="#dc78ff" stroke-width="5" stroke-dasharray="18 12"/><text x="620" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#dc78ff">Reference scenario shown: safeDrawing = 0 px, density = 2 px/dp</text><rect x="0" y="110" width="1240" height="314" fill="url(#danger)" stroke="#ff5b63" stroke-width="4"/><text x="12" y="138" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ff5b63">LIVE MIRRORED CONTENT — example height 314 px</text><line x1="0" y1="424" x2="1240" y2="424" stroke="#24d4e8" stroke-width="7" stroke-dasharray="24 12"/><text x="620" y="454" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#24d4e8">dynamic panel / trackpad boundary</text><rect x="24" y="430" width="1192" height="516" fill="url(#dynamic)" stroke="#24d4e8" stroke-width="4"/><text x="36" y="458" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#24d4e8">Remaining TouchSurface — dynamic height</text><rect x="24" y="808" width="405" height="138" rx="0" fill="#ff5b63" fill-opacity="0.15" stroke="#ff5b63" stroke-width="4"/><text x="36" y="836" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ff5b63">LMB: 34% wide; clamped height</text><rect x="811" y="808" width="405" height="138" rx="0" fill="#ff5b63" fill-opacity="0.15" stroke="#ff5b63" stroke-width="4"/><text x="823" y="836" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ff5b63">RMB: 34% wide; clamped height</text><rect x="24" y="952" width="264" height="112" rx="14" fill="#ffc857" fill-opacity="0.11" stroke="#ffc857" stroke-width="4"/><text x="36" y="980" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffc857">COMPANION</text><rect x="976" y="952" width="264" height="112" rx="14" fill="#ffc857" fill-opacity="0.11" stroke="#ffc857" stroke-width="4"/><text x="988" y="980" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffc857">SETTINGS</text><rect x="330" y="500" width="650" height="186" rx="10" fill="#101820" fill-opacity=".94" stroke="#263746" stroke-width="2"/><text x="344" y="528" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#f4f7fa">DYNAMIC HEIGHT FORMULA</text><text x="344" y="555" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">interfaceAspect = sourceAspect / (1 − splitRatio), orientation-adjusted.</text><text x="344" y="582" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">desired = safeWidth / interfaceAspect × 1.35.</text><text x="344" y="609" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">actual = min(desired, safeHeight − 176 dp).</text><text x="344" y="636" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">splitRatio is 0.05…0.95; default 0.75; snapped to source pixels.</text><text x="344" y="663" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Example: 4:3 source, 0.75 split, zero inset → 314 px panel.</text><text x="620" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#ff5b63">NO ARTWORK MAY COVER THIS REGION</text><rect x="18" y="1021" width="1204" height="45" rx="8" fill="#101820" fill-opacity=".95"/><rect x="28" y="1036" width="20" height="20" fill="#4ddd8b"/><text x="56" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">artwork-safe</text><rect x="196" y="1036" width="20" height="20" fill="#ff5b63"/><text x="224" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">live/protected</text><rect x="382" y="1036" width="20" height="20" fill="#24d4e8"/><text x="410" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">dynamic</text><rect x="505" y="1036" width="20" height="20" fill="#ffc857"/><text x="533" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">native text/control</text><rect x="736" y="1036" width="20" height="20" fill="#dc78ff"/><text x="764" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">runtime inset</text></svg>