<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1080" viewBox="0 0 1240 1080"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#263746" stroke-width="1"/></pattern><pattern id="danger" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="20" fill="#ff5b63" fill-opacity=".16"/></pattern><pattern id="dynamic" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 24L24 0" stroke="#24d4e8" stroke-opacity=".18" stroke-width="6"/></pattern></defs><rect width="1240" height="1080" fill="#101820"/><rect width="1240" height="1080" fill="url(#grid)"/><rect x="4" y="4" width="1232" height="1072" fill="none" stroke="#f4f7fa" stroke-width="8"/><rect x="22" y="18" width="1150" height="84" rx="10" fill="#101820" fill-opacity=".94"/><text x="38" y="52" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#f4f7fa">COMPANION — HOME / companion.background</text><text x="38" y="82" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Fixed runtime-owned geometry: full immersive surface, title at top, Notes left, Walkthrough right</text><rect x="0" y="0" width="1240" height="1080" rx="0" fill="#dc78ff" fill-opacity="0.025" stroke="#dc78ff" stroke-width="5" stroke-dasharray="18 12"/><text x="620" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#dc78ff">Reference scenario shown: safeDrawing = 0 px, density = 2 px/dp</text><rect x="0" y="0" width="1240" height="144" rx="0" fill="#ffc857" fill-opacity="0.1" stroke="#ffc857" stroke-width="4"/><rect id="companion-header-art-safe-area" x="32" y="16" width="1080" height="112" rx="0" fill="#4ddd8b" fill-opacity="0.035" stroke="#4ddd8b" stroke-width="3" stroke-dasharray="16 10"/><text x="44" y="44" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#4ddd8b">TITLE / DECORATIVE HEADER ART</text><rect id="companion-header-close-hit-area" x="1112" y="16" width="96" height="112" rx="10" fill="#ffc857" fill-opacity="0.12" stroke="#ffc857" stroke-width="3" stroke-dasharray="10 7"/><text x="1124" y="44" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffc857">CLOSE 48×56 dp</text><text x="620" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#ffc857">HEADER 72 dp • CLOSE HIT TARGET IS RUNTIME-OWNED</text><rect id="companion-notes-hit-area" x="32" y="240" width="572" height="192" rx="14" fill="#24d4e8" fill-opacity="0.1" stroke="#24d4e8" stroke-width="5"/><text x="44" y="268" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#24d4e8">NOTES BUTTON — FIXED HIT AREA 286×96 dp</text><rect id="companion-notes-art-safe-area" x="64" y="272" width="508" height="128" rx="8" fill="#4ddd8b" fill-opacity="0.035" stroke="#4ddd8b" stroke-width="2" stroke-dasharray="10 7"/><text x="76" y="300" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#4ddd8b">RECOMMENDED ART SAFE</text><rect id="companion-walkthrough-hit-area" x="636" y="240" width="572" height="192" rx="14" fill="#24d4e8" fill-opacity="0.1" stroke="#24d4e8" stroke-width="5"/><text x="648" y="268" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#24d4e8">WALKTHROUGH BUTTON — FIXED HIT AREA 286×96 dp</text><rect id="companion-walkthrough-art-safe-area" x="668" y="272" width="508" height="128" rx="8" fill="#4ddd8b" fill-opacity="0.035" stroke="#4ddd8b" stroke-width="2" stroke-dasharray="10 7"/><text x="680" y="300" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#4ddd8b">RECOMMENDED ART SAFE</text><rect x="32" y="464" width="1176" height="552" fill="url(#dynamic)" stroke="#4ddd8b" stroke-width="4"/><text x="44" y="492" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#4ddd8b">OPEN AREA — reserved for future fixed Companion actions</text><rect x="300" y="560" width="720" height="186" rx="10" fill="#101820" fill-opacity=".94" stroke="#263746" stroke-width="2"/><text x="314" y="588" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#f4f7fa">IMMERSIVE AUTHORING RULE</text><text x="314" y="615" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Paint the Companion title and surrounding decoration into this background.</text><text x="314" y="642" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Dedicated Notes/Walkthrough normal/pressed assets supply action art and labels.</text><text x="314" y="669" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Hit areas are fixed by AdventurePad; artists never define interaction coordinates.</text><text x="314" y="696" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Dashed green areas are recommended 16 dp essential-art margins.</text><text x="314" y="723" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#a8b6c2">Standard supplies visible header/buttons; runtime still owns semantics and press input.</text><rect x="18" y="1021" width="1204" height="45" rx="8" fill="#101820" fill-opacity=".95"/><rect x="28" y="1036" width="20" height="20" fill="#4ddd8b"/><text x="56" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">artwork-safe</text><rect x="196" y="1036" width="20" height="20" fill="#ff5b63"/><text x="224" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">live/protected</text><rect x="382" y="1036" width="20" height="20" fill="#24d4e8"/><text x="410" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">dynamic</text><rect x="505" y="1036" width="20" height="20" fill="#ffc857"/><text x="533" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">native text/control</text><rect x="736" y="1036" width="20" height="20" fill="#dc78ff"/><text x="764" y="1053" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#f4f7fa">runtime inset</text></svg>